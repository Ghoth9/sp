<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spairdee - Icon Generator</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            gap: 2rem;
        }
        h1 { color: #06b6d4; }
        .canvases { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
        .canvas-group { text-align: center; }
        .canvas-group p { margin: 0.5rem 0; color: #94a3b8; }
        canvas { border: 1px solid #1e293b; border-radius: 8px; }
        button {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .instructions {
            max-width: 600px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>🎨 Spairdee Icon Generator</h1>
    <div class="instructions">
        <p><strong>Instructions:</strong> Click the buttons below to generate and download PWA icons. 
        Save them to the <code>assets/icons/</code> folder as <code>icon-192.png</code>, <code>icon-512.png</code>, and <code>logo.png</code>.</p>
    </div>
    <div class="canvases">
        <div class="canvas-group">
            <canvas id="canvas192" width="192" height="192"></canvas>
            <p>192×192</p>
            <button onclick="download('canvas192', 'icon-192.png')">Download 192px</button>
        </div>
        <div class="canvas-group">
            <canvas id="canvas512" width="512" height="512"></canvas>
            <p>512×512</p>
            <button onclick="download('canvas512', 'icon-512.png')">Download 512px</button>
        </div>
    </div>

    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 512;

            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, size, size);
            bgGrad.addColorStop(0, '#0a0e17');
            bgGrad.addColorStop(1, '#131a2e');
            ctx.fillStyle = bgGrad;
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            ctx.fill();

            // Outer ring
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
            ctx.lineWidth = 2 * scale;
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, 230 * scale, 0, Math.PI * 2);
            ctx.stroke();

            const cx = 256 * scale;
            const cy = 230 * scale;

            // Glow
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 12 * scale;

            const cyanGrad = ctx.createLinearGradient(cx - 90 * scale, cy - 90 * scale, cx + 90 * scale, cy + 90 * scale);
            cyanGrad.addColorStop(0, '#22d3ee');
            cyanGrad.addColorStop(1, '#0891b2');

            // Center dot
            ctx.fillStyle = cyanGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, 12 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Draw snowflake arms
            ctx.strokeStyle = cyanGrad;
            ctx.lineCap = 'round';

            function drawArm(angle) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Main arm
                ctx.lineWidth = 8 * scale;
                ctx.beginPath();
                ctx.moveTo(0, -18 * scale);
                ctx.lineTo(0, -90 * scale);
                ctx.stroke();

                // Branch at 60
                ctx.lineWidth = 6 * scale;
                ctx.beginPath();
                ctx.moveTo(0, -60 * scale);
                ctx.lineTo(-22 * scale, -82 * scale);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -60 * scale);
                ctx.lineTo(22 * scale, -82 * scale);
                ctx.stroke();

                // Branch at 40
                ctx.lineWidth = 5 * scale;
                ctx.beginPath();
                ctx.moveTo(0, -40 * scale);
                ctx.lineTo(-15 * scale, -55 * scale);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -40 * scale);
                ctx.lineTo(15 * scale, -55 * scale);
                ctx.stroke();

                ctx.restore();
            }

            for (let i = 0; i < 6; i++) {
                drawArm(i * Math.PI / 3);
            }

            // Wrench
            ctx.save();
            ctx.translate(330 * scale, 330 * scale);
            ctx.rotate(-Math.PI / 4);

            ctx.shadowBlur = 8 * scale;
            ctx.fillStyle = '#06b6d4';

            // Handle
            const rr = 6 * scale;
            const rw = 16 * scale;
            const rh = 75 * scale;
            const rx = -8 * scale;
            const ry = -60 * scale;
            ctx.beginPath();
            ctx.moveTo(rx + rr, ry);
            ctx.lineTo(rx + rw - rr, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + rr);
            ctx.lineTo(rx + rw, ry + rh - rr);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - rr, ry + rh);
            ctx.lineTo(rx + rr, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rr);
            ctx.lineTo(rx, ry + rr);
            ctx.quadraticCurveTo(rx, ry, rx + rr, ry);
            ctx.fill();

            // Wrench head
            ctx.beginPath();
            ctx.moveTo(-20 * scale, -60 * scale);
            ctx.bezierCurveTo(-20 * scale, -80 * scale, -8 * scale, -90 * scale, 0, -90 * scale);
            ctx.bezierCurveTo(8 * scale, -90 * scale, 20 * scale, -80 * scale, 20 * scale, -60 * scale);
            ctx.lineTo(12 * scale, -60 * scale);
            ctx.bezierCurveTo(12 * scale, -72 * scale, 8 * scale, -80 * scale, 0, -80 * scale);
            ctx.bezierCurveTo(-8 * scale, -80 * scale, -12 * scale, -72 * scale, -12 * scale, -60 * scale);
            ctx.closePath();
            ctx.fill();

            // Grip lines
            ctx.strokeStyle = '#0a0e17';
            ctx.lineWidth = 2 * scale;
            ctx.shadowBlur = 0;
            for (let y of [-6, 0, 6]) {
                ctx.beginPath();
                ctx.moveTo(-5 * scale, y * scale);
                ctx.lineTo(5 * scale, y * scale);
                ctx.stroke();
            }

            ctx.restore();

            // Text
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';

            ctx.fillStyle = '#e2e8f0';
            ctx.font = `700 ${48 * scale}px Inter, Arial, sans-serif`;
            ctx.letterSpacing = `${6 * scale}px`;
            ctx.fillText('SP', 256 * scale, 400 * scale);

            ctx.fillStyle = '#06b6d4';
            ctx.font = `500 ${22 * scale}px Inter, Arial, sans-serif`;
            ctx.fillText('SPAIRDEE', 256 * scale, 435 * scale);
        }

        function download(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Draw on load
        const canvas192 = document.getElementById('canvas192');
        const canvas512 = document.getElementById('canvas512');
        drawIcon(canvas192);
        drawIcon(canvas512);

        if (window.location.search.includes('auto=true')) {
            const sendImage = (name, canvas) => {
                return fetch('/save-icon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, data: canvas.toDataURL('image/png') })
                });
            };
            Promise.all([
                sendImage('icon-192.png', canvas192),
                sendImage('icon-512.png', canvas512),
                sendImage('logo.png', canvas192)
            ]).then(() => {
                fetch('/done');
            }).catch(err => {
                console.error('Failed to auto-save icons:', err);
            });
        }
    </script>
</body>
</html>
