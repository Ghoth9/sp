<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spairdee - Icon Generator</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            gap: 2rem;
        }
        h1 { color: #06b6d4; }
        .canvases { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
        .canvas-group { text-align: center; }
        .canvas-group p { margin: 0.5rem 0; color: #94a3b8; }
        canvas { border: 1px solid #1e293b; border-radius: 8px; }
        button {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .instructions {
            max-width: 600px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>🎨 Spairdee Icon Generator</h1>
    <div class="instructions">
        <p><strong>Instructions:</strong> Click the buttons below to generate and download PWA icons. 
        Save them to the <code>assets/icons/</code> folder as <code>icon-192.png</code>, <code>icon-512.png</code>, and <code>logo.png</code>.</p>
    </div>
    <div class="canvases">
        <div class="canvas-group">
            <canvas id="canvas192" width="192" height="192"></canvas>
            <p>192×192</p>
            <button onclick="download('canvas192', 'icon-192.png')">Download 192px</button>
        </div>
        <div class="canvas-group">
            <canvas id="canvas512" width="512" height="512"></canvas>
            <p>512×512</p>
            <button onclick="download('canvas512', 'icon-512.png')">Download 512px</button>
        </div>
    </div>

    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 512;

            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, size, size);
            bgGrad.addColorStop(0, '#0a0e17');
            bgGrad.addColorStop(1, '#131a2e');
            ctx.fillStyle = bgGrad;
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            ctx.fill();

            // Stylized SP Emblem

            // Draw Left block (S) - Black/Slate
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(186 * scale, 150 * scale);
            ctx.lineTo(271 * scale, 150 * scale);
            ctx.lineTo(231 * scale, 300 * scale);
            ctx.lineTo(146 * scale, 300 * scale);
            ctx.closePath();
            ctx.fill();

            // Draw Right block (P) - Blue
            ctx.fillStyle = '#00a2e8';
            ctx.beginPath();
            ctx.moveTo(281 * scale, 150 * scale);
            ctx.lineTo(366 * scale, 150 * scale);
            ctx.lineTo(326 * scale, 300 * scale);
            ctx.lineTo(241 * scale, 300 * scale);
            ctx.closePath();
            ctx.fill();

            // Draw White S Path
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 14 * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(241 * scale, 175 * scale);
            ctx.lineTo(211 * scale, 175 * scale);
            ctx.lineTo(196 * scale, 220 * scale);
            ctx.lineTo(226 * scale, 220 * scale);
            ctx.lineTo(211 * scale, 265 * scale);
            ctx.lineTo(181 * scale, 265 * scale);
            ctx.stroke();

            // Draw White P Path
            ctx.beginPath();
            ctx.moveTo(286 * scale, 275 * scale);
            ctx.lineTo(321 * scale, 175 * scale);
            ctx.lineTo(351 * scale, 175 * scale);
            ctx.lineTo(336 * scale, 225 * scale);
            ctx.lineTo(306 * scale, 225 * scale);
            ctx.stroke();

            // Draw Text: AIRCON AND SERVICE
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#94a3b8';
            ctx.font = `700 ${14 * scale}px Inter, Arial, sans-serif`;
            if ('letterSpacing' in ctx) {
                ctx.letterSpacing = `${3 * scale}px`;
            }
            ctx.fillText('AIRCON AND SERVICE', 256 * scale, 340 * scale);
        }

        function download(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Draw on load
        const canvas192 = document.getElementById('canvas192');
        const canvas512 = document.getElementById('canvas512');
        drawIcon(canvas192);
        drawIcon(canvas512);

        if (window.location.search.includes('auto=true')) {
            const sendImage = (name, canvas) => {
                return fetch('/save-icon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, data: canvas.toDataURL('image/png') })
                });
            };
            Promise.all([
                sendImage('icon-192.png', canvas192),
                sendImage('icon-512.png', canvas512),
                sendImage('logo.png', canvas192)
            ]).then(() => {
                fetch('/done');
            }).catch(err => {
                console.error('Failed to auto-save icons:', err);
            });
        }
    </script>
</body>
</html>
