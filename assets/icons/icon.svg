<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#131a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Stylized SP Emblem -->
  <g transform="translate(0, 0)">
    <!-- Left block (S) - Black/Slate -->
    <path d="M 186 150 L 271 150 L 231 300 L 146 300 Z" fill="#1e293b" />
    
    <!-- Right block (P) - Blue -->
    <path d="M 281 150 L 366 150 L 326 300 L 241 300 Z" fill="#00a2e8" />
    
    <!-- White S Path -->
    <path d="M 241 175 L 211 175 L 196 220 L 226 220 L 211 265 L 181 265" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- White P Path -->
    <path d="M 286 275 L 321 175 L 351 175 L 336 225 L 306 225" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Text: AIRCON AND SERVICE -->
    <text x="256" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="14" fill="#94a3b8" letter-spacing="3">
