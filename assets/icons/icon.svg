<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#131a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Snowflake / AC symbol - main element -->
  <g transform="translate(256, 230)" filter="url(#softGlow)">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="url(#cyanGrad)" />

    <!-- 6 main arms of the snowflake -->
    <!-- Top -->
    <line x1="0" y1="-18" x2="0" y2="-90" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="-60" x2="-22" y2="-82" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-60" x2="22" y2="-82" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-40" x2="-15" y2="-55" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="-40" x2="15" y2="-55" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Bottom -->
    <line x1="0" y1="18" x2="0" y2="90" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="60" x2="-22" y2="82" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="60" x2="22" y2="82" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="40" x2="-15" y2="55" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="40" x2="15" y2="55" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Top-right -->
    <line x1="15.6" y1="-9" x2="77.9" y2="-45" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="51.9" y1="-30" x2="51.9" y2="-60" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="51.9" y1="-30" x2="77.9" y2="-24" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Bottom-left -->
    <line x1="-15.6" y1="9" x2="-77.9" y2="45" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="-51.9" y1="30" x2="-51.9" y2="60" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="-51.9" y1="30" x2="-77.9" y2="24" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Top-left -->
    <line x1="-15.6" y1="-9" x2="-77.9" y2="-45" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="-51.9" y1="-30" x2="-77.9" y2="-24" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="-51.9" y1="-30" x2="-51.9" y2="-60" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Bottom-right -->
    <line x1="15.6" y1="9" x2="77.9" y2="45" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="51.9" y1="30" x2="77.9" y2="24" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="51.9" y1="30" x2="51.9" y2="60" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Wrench overlay (bottom-right) -->
  <g transform="translate(330, 330) rotate(-45)" filter="url(#glow)">
    <!-- Wrench handle -->
    <rect x="-8" y="-60" width="16" height="75" rx="6" fill="#06b6d4" opacity="0.9" />
    <!-- Wrench head -->
    <path d="M -20,-60 C -20,-80 -8,-90 0,-90 C 8,-90 20,-80 20,-60 L 12,-60 C 12,-72 8,-80 0,-80 C -8,-80 -12,-72 -12,-60 Z" fill="#06b6d4" opacity="0.9" />
    <!-- Wrench grip lines -->
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#0a0e17" stroke-width="2" stroke-linecap="round" />
    <line x1="-5" y1="6" x2="5" y2="6" stroke="#0a0e17" stroke-width="2" stroke-linecap="round" />
    <line x1="-5" y1="-6" x2="5" y2="-6" stroke="#0a0e17" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Text: "AC" -->
  <text x="256" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="48" fill="#e2e8f0" letter-spacing="6">
    AC
  </text>
  <!-- Text: "SERVICE PRO" -->
  <text x="256" y="435" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="20" fill="#06b6d4" letter-spacing="8">
    SERVICE PRO
  </text>
</svg>
